services:
  - type: web
    name: handoff-payments
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: DYNAMIC_ENVIRONMENT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: MAX_MAINNET_USDC_MINOR
        value: "25000000"
      - key: MAX_DAILY_MAINNET_USDC_MINOR
        value: "100000000"
