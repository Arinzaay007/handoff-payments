# Render Blueprint for Handoff (https://github.com/Arinzaay007/handoff-payments)
#
# This file contains NO secrets and NO environment values on purpose.
# Every variable below is declared with `sync: false`, so Render asks for each
# value in its dashboard when the Blueprint is created. Paste secrets only into
# Render's encrypted Variables panel — never into this file, a chat, or Git.
#
# Create it with: Render dashboard -> New -> Blueprint -> select this repository.
#
# Free-plan notes:
#   * Build:  npm ci && npm run build   (regenerates public/dynamic-client.js)
#   * Start:  npm start                 (Node server binds 0.0.0.0:$PORT)
#   * Health: GET /api/config           (readiness booleans + caps + public Git revision)
services:
  - type: web
    name: handoff-payments
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      # Public by design. This is the only value the browser ever receives,
      # served from GET /api/public-config.
      - key: DYNAMIC_ENVIRONMENT_ID
        sync: false

      # Public Supabase project URL, e.g. https://<project-ref>.supabase.co.
      # It is only half of the pair; the key below is the secret half.
      - key: SUPABASE_URL
        sync: false

      # SERVER-ONLY SECRET. Rotate/revoke the previously exposed key first, then
      # paste the new value into Render. Never commit it, never send it in chat.
      - key: SUPABASE_SECRET_KEY
        sync: false

      # Mainnet caps, in USDC six-decimal minor units (non-secret defaults).
      # 25000000 = 25.00 USDC per payment, 100000000 = 100.00 USDC per day.
      # The server also falls back to these same defaults if left unset.
      - key: MAX_MAINNET_USDC_MINOR
        sync: false
      - key: MAX_DAILY_MAINNET_USDC_MINOR
        sync: false

      # SERVER-ONLY SECRET. Relay requires this key on POST /quote/v2 from 2 October 2026.
      # Paste it only into Render's encrypted Variables panel. Never commit it, never send it in chat.
      - key: RELAY_API_KEY
        sync: false

      # Optional. Monad JSON-RPC used to verify USDC settlement and relayer operating balance.
      # Defaults to https://rpc.monad.xyz.
      - key: MONAD_RPC_URL
        sync: false

      # SERVER-ONLY SECRET. Dedicated Monad relayer for Handoff-to-Handoff Send money.
      # Do not enter this until migration 0005 is applied and the account is funded with MON.
      # It never belongs in browser code, a commit, or chat.
      - key: HANDOFF_RELAYER_PRIVATE_KEY
        sync: false

      # Optional non-secret MON reserve in wei. 0.05 MON is enforced as the minimum even if unset.
      - key: HANDOFF_RELAYER_MIN_MON_WEI
        sync: false
